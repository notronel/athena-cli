[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athenanet-cli"
version = "0.1.0"
description = "A read-only command line client for athenahealth sandbox APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ronel" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
athena = "athenanet_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/athenanet_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
